[package]
name = "leek-zcash-ffi"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"
description = "UniFFI bindings (Kotlin, Swift) for leek-zcash: a byte-oriented API, one error type with stable codes, and a foreign transport callback so the host app owns the USB or Bluetooth link."

[lib]
crate-type = ["cdylib", "staticlib", "lib"]

[[bin]]
# The bindings generator, pinned with the scaffolding (scripts/generate.sh).
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
uniffi = "=0.29.5"
# leek-device reports its errors as anyhow; leek_zcash::classify maps them.
anyhow = "=1.0.100"
leek-zcash = { path = "../leek-zcash" }
# Animated QR (UR) parts, the same code the companion and zecz use.
leek-ur = { path = "../leek-ur" }
# Wiping what a KeyWrapper unwraps (already in the tree through leek-zcash).
zeroize = "1"
leek-transport-serial = { path = "../../app/transport-serial", default-features = false }

[dev-dependencies]
# zdev's PTY, for the end-to-end test of the foreign transport.
leek-transport-serial = { path = "../../app/transport-serial", features = ["serialport"] }
serde_json = "1"
# A raw byte stream over the PTY, as a USB host moves it.
serialport = { version = "=4.10.1", default-features = false }
hex = "0.4"
# A PCZT made the way Zodl's Android SDK 6.0.0 makes it (the same
# zcash_client_backend: create_pczt_from_proposal, redact_pczt_for_signer)
# for an account imported with its ZIP 32 derivation, through zecz-core's
# wallet fixture (tests/zodl.rs). Test-only; the versions are zecz-core's,
# already in Cargo.lock.
zecz-core = { path = "../zecz-core" }
# The JNI library the Zodl fork still links, compared call for call
# (tests/jni_parity.rs) until the fork moves to these bindings.
leek-android = { path = "../leek-android" }
pczt = { version = "=0.10.0", default-features = false }
rand = { version = "0.10", features = ["sys_rng"] }
zcash_client_backend = { version = "=0.25.0", default-features = false }
zcash_client_sqlite = { version = "=0.23.0", default-features = false }
zcash_keys = { version = "=0.17.0", default-features = false }
zcash_primitives = { version = "=0.31.0", default-features = false }
zcash_protocol = { version = "=0.11.0", default-features = false }
zcash_transparent = { version = "=0.11.0", default-features = false }
zcash_address = { version = "=0.14.0", default-features = false }
zip321 = { version = "=0.10.0", default-features = false }
rusqlite = { version = "0.37", default-features = false }
tokio = { version = "1", default-features = false }

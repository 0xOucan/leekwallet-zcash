[package]
name = "leek-device"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "The LeekWallet device client: v2 pairing, encrypted session, Zcash calls, and the .zsig format. Transport-agnostic, so zecz (USB serial) and the Android app (USB OTG through JNI) share it."

[dependencies]
anyhow = "1"
sha2 = "0.10"
hex = "0.4"
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
ciborium = "0.2"
getrandom = "0.3"
# Wipes the Storage Key the board sends (z_get_storage_key).
zeroize = "1"
leek-transport-serial = { path = "../../app/transport-serial", default-features = false }
# Bluetooth LE on the desktop (src/ble.rs): LeekWallet's own btleplug
# transport, the one the Zcash LeekWallet app uses, behind `ble`.
leek-transport-ble = { path = "../../app/transport-ble", default-features = false, optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"], optional = true }

[features]
default = ["serial"]
# The desktop serial port. Off for Android, where Kotlin owns the USB device.
serial = ["leek-transport-serial/serialport"]
# Bluetooth LE through btleplug (BlueZ over D-Bus on Linux: needs libdbus-1
# to build). Off for Android, where the radio is Kotlin's.
ble = ["dep:leek-transport-ble", "leek-transport-ble/ble", "dep:tokio"]

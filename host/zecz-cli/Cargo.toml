[package]
name = "zecz-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "LeekWallet Zcash: host companion CLI (watch-only wallet, PCZT builder, prover, broadcaster)"

[[bin]]
name = "zecz"
path = "src/main.rs"

[lib]
name = "zecz"
path = "src/lib.rs"

# Path dependencies on the reference checkout of librustzcash (the same
# commit as vectors/gen and zsign-rust), so the host builds exactly the
# PCZT encoding and Orchard/Ironwood circuits the device checks.
[dependencies]
zcash_client_backend = { path = "../../../referencialeekwallet/zec references/librustzcash/zcash_client_backend", features = [
    "orchard",
    "transparent-inputs",
    "pczt",
    "sync",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
zcash_client_sqlite = { path = "../../../referencialeekwallet/zec references/librustzcash/zcash_client_sqlite", features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { path = "../../../referencialeekwallet/zec references/librustzcash/zcash_keys", features = ["orchard", "transparent-inputs"] }
zcash_protocol = { path = "../../../referencialeekwallet/zec references/librustzcash/components/zcash_protocol" }
zcash_address = { path = "../../../referencialeekwallet/zec references/librustzcash/components/zcash_address" }
zip321 = { path = "../../../referencialeekwallet/zec references/librustzcash/components/zip321" }
zcash_primitives = { path = "../../../referencialeekwallet/zec references/librustzcash/zcash_primitives", features = ["transparent-inputs"] }
zcash_transparent = { path = "../../../referencialeekwallet/zec references/librustzcash/zcash_transparent", features = ["transparent-inputs"] }
pczt = { path = "../../../referencialeekwallet/zec references/librustzcash/pczt", features = ["orchard", "transparent", "signer", "prover", "tx-extractor"] }
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
zip32 = "0.3"

tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
bip39 = { version = "2", features = ["std"] }
hex = "0.4"
sha2 = "0.10"
rand = { version = "0.10", features = ["sys_rng"] }
secrecy = "0.8"
rusqlite = "0.37"

[dev-dependencies]
serde_json = "1"

[package]
name = "zecz-core"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "LeekWallet Zcash: host companion library (watch-only wallet, PCZT builder, prover, broadcaster) behind the zecz CLI and the desktop app"

[lib]
name = "zecz"
path = "src/lib.rs"

# The released librustzcash crates, pinned exactly, the versions Zodl's Android
# SDK 6.0.0 uses. They set the NU7 mainnet activation height. The firmware's
# zsign-rust stays on pczt =0.10.0-pre.2: the two share one wire format, and
# vectors/ proves it (docs/zcash/MAINNET.md).
[dependencies]
zcash_client_backend = { version = "=0.25.0", features = [
    "orchard",
    "transparent-inputs",
    "pczt",
    "sync",
    "lightwalletd-tonic",
    "lightwalletd-tonic-transport",
    "lightwalletd-tonic-tls-webpki-roots",
] }
zcash_client_sqlite = { version = "=0.23.0", features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "transparent-inputs"] }
zcash_protocol = { version = "=0.11.0" }
zcash_address = { version = "=0.14.0" }
zip321 = { version = "=0.10.0" }
zcash_primitives = { version = "=0.31.0", features = ["transparent-inputs"] }
zcash_transparent = { version = "=0.11.0", features = ["transparent-inputs"] }
pczt = { version = "=0.10.0", features = ["orchard", "transparent", "signer", "prover", "tx-extractor"] }
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
zip32 = "0.3"
# The same libsecp256k1 the pczt transparent signer uses: DER signatures of
# transparent inputs (roadmap 10.1).
secp256k1 = "0.33"

tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
async-trait = "0.1"
anyhow = "1"
bip39 = { version = "2", features = ["std"] }
hex = "0.4"
sha2 = "0.10"
rand = { version = "0.10", features = ["sys_rng"] }
secrecy = "0.8"
rusqlite = "0.37"

# The device link (leek-device): LeekWallet's own serial framing, and the
# session primitives session.c uses.
leek-transport-serial = { path = "../../app/transport-serial", default-features = false }
leek-device = { path = "../leek-device", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
hkdf = "0.12"
chacha20poly1305 = "0.10"
ciborium = "0.2"
getrandom = "0.3"
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", features = ["hmac"] }
hmac = "0.12"

[features]
# The desktop serial port (`Device::open`), as before for zecz and the
# desktop app. Off for an Android build (the LeekWallet Companion), where
# the `serialport` crate cannot build and its own transport crate selects
# the Android USB backend instead: the two backends refuse to coexist.
default = ["serial"]
serial = ["leek-device/serial", "leek-transport-serial/serialport"]

[dev-dependencies]
serde_json = "1"
# The SDK's preflight and broadcast check on what the propose path builds
# (tests/nu7.rs).
leek-zcash = { path = "../leek-zcash" }

[package]
name = "leek-android"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
description = "Native code for the LeekWallet Zcash Android app (JNI): the device client over a Kotlin-owned USB link, and applying a device .zsig to a PCZT."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
pczt = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", features = ["orchard", "signer"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b" }
orchard = { version = "0.16", default-features = false, features = ["std"] }
sha2 = "0.10"
# DER signatures of transparent inputs (roadmap 10.1); already in the tree
# through the pczt transparent signer.
secp256k1 = "0.33"
jni = { version = "0.21", default-features = false }
leek-device = { path = "../leek-device", default-features = false }
leek-transport-serial = { path = "../../firmware/app/transport-serial", default-features = false }
anyhow = "1"
ciborium = "0.2"
hex = "0.4"

[dev-dependencies]
zecz-core = { path = "../zecz-core" }
rand = { version = "0.10", features = ["sys_rng"] }

# Builds the LeekWallet Zcash desktop app (desktop/) on Linux, Windows and
# macOS, and runs the host/ tests (zecz-core, zecz-cli, leek-device,
# leek-android) on Linux. The tests that need testnet lightwalletd are
# #[ignore]d and do not run here.
name: desktop

on:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "host/**"
      - "app/transport-serial/**"
      - "app/transport-ble/**"
      - "vectors/**"
      - ".github/workflows/desktop.yml"
  pull_request:
    paths:
      - "desktop/**"
      - "host/**"
      - "app/transport-serial/**"
      - "app/transport-ble/**"
      - "vectors/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  host-tests:
    name: host tests (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # serialport (leek-transport-serial) links libudev.
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libudev-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: host
      - name: cargo test (host/)
        working-directory: host
        run: cargo test --locked

  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # librustzcash and the Tauri tree have paths past Windows' 260-char
      # default.
      - name: Long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true
      - uses: actions/checkout@v4
      # libudev: the serial port (serialport); libdbus: Bluetooth through
      # BlueZ (btleplug, leek-transport-ble).
      - name: System packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libdbus-1-dev libssl-dev patchelf pkg-config
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Install frontend dependencies
        working-directory: desktop
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        working-directory: desktop
        run: pnpm typecheck
      # The frontend has to exist before the backend compiles:
      # tauri::generate_context! embeds desktop/dist.
      - name: Build frontend
        working-directory: desktop
        run: pnpm build
      # Includes the hardware-account tests against zdev, which they build
      # with make (firmware/sim) and skip, loudly, if that fails.
      - name: Backend tests
        if: runner.os == 'Linux'
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: tauri build
        working-directory: desktop
        run: pnpm tauri build --ci
      - uses: actions/upload-artifact@v4
        with:
          name: leekwallet-zcash-${{ runner.os }}
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

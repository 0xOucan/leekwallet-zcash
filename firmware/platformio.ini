; ============================================================================
; LeekWallet - ESP32-S3 Mini + SSD1306 OLED + 4 Buttons
; ============================================================================
; Hardware:
;   - ESP32-S3 Mini (no PSRAM, 4MB flash)
;   - SSD1306 OLED 128x64 I2C (0x3C)
;   - 4 buttons (K1-K4) active-low with internal pull-ups
; ============================================================================

[env:esp32s3]
; Pinned, not floating. The binary is only reproducible relative to a fixed
; toolchain: a different espressif32 release brings a different ESP-IDF and a
; different compiler, and the output changes for reasons that have nothing to
; do with this source. Unpinned, "rebuild the tag and compare hashes" would
; fail for everyone whose PlatformIO happened to update, which is the same as
; having no check at all. 6.12.0 == ESP-IDF 5.5.0, toolchain 14.2.0.
; Moving this pin is a deliberate act with a new release and new hashes.
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = espidf

; ----------------------------------------------------------------------------
; Flash configuration - CRITICAL for stability
; The attached board reports 16MB (verified from the boot log). A smaller
; value here silently caps usable flash.
; ----------------------------------------------------------------------------
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; ----------------------------------------------------------------------------
; Upload configuration for ESP32-S3 native USB
; Some ESP32-S3 boards need special handling for USB reset
; ----------------------------------------------------------------------------
upload_speed = 921600
upload_port = /dev/ttyACM*
upload_protocol = esptool

; ESP32-S3 USB-Serial-JTAG supports automatic boot mode entry
upload_flags =
    --before=default_reset
    --after=hard_reset

; ----------------------------------------------------------------------------
; Console configuration
; Use UART for stability (USB-CDC can cause boot issues on some boards)
; ----------------------------------------------------------------------------
monitor_speed = 115200
monitor_port = /dev/ttyACM*
monitor_filters = esp32_exception_decoder

; ----------------------------------------------------------------------------
; Custom partition table for NVS storage (wallet data)
; ----------------------------------------------------------------------------
board_build.partitions = partitions.csv

; ----------------------------------------------------------------------------
; Build flags for trezor-crypto
; ----------------------------------------------------------------------------
; Zcash signer (Rust, no_std staticlib): cargo runs before the build and the
; library is linked in. See scripts/zsign_cargo.py and docs/TOOLCHAIN.md.
custom_zsign_dir = components/zsign-rust
extra_scripts = pre:scripts/zsign_cargo.py

build_flags =
    -DLEEK_BOARD_S3
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0

; ----------------------------------------------------------------------------
; ESP-IDF Kconfig overrides for BLE
; ----------------------------------------------------------------------------
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

; ----------------------------------------------------------------------------
; Force sdkconfig defaults to be applied
; ----------------------------------------------------------------------------
board_build.sdkconfig_defaults = sdkconfig.defaults

; ============================================================================
; Wi-Fi test fixture - development only
;
; The AP brings up a hardcoded password on a device holding seeds, so the
; default build compiles it out entirely (AUDIT S8g, T17) and the settings
; menu loses the entry with it. This environment exists for the occasions the
; fixture is genuinely wanted; nothing ships from it.
; ============================================================================
[env:esp32s3-wifi]
extends = env:esp32s3
board_build.sdkconfig_defaults = sdkconfig.wifi
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.wifi

; ============================================================================
; Secure target - QEMU only
;
; Identical firmware with flash encryption and secure boot v2 enabled. Kept as
; a separate environment because these settings burn eFuses on first boot and
; eFuses do not come back. `pio run -e esp32s3` stays safe for an attached
; board; this one is developed against QEMU's emulated fuses until the scheme
; is proven.
;
;   ./scripts/qemu-secure.sh
; ============================================================================
[env:esp32s3-secure]
extends = env:esp32s3
; One complete defaults file, not a list. PlatformIO silently dropped the
; overrides when this was `sdkconfig.defaults;sdkconfig.secure` under `extends`,
; producing a build that looked configured and was not.
board_build.sdkconfig_defaults = sdkconfig.secure
; The base environment pins the defaults file through cmake_extra_args, which
; extends inherits and which wins over sdkconfig_defaults. Overriding one
; without the other produced a build that reported success and had none of the
; security options set.
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.secure
board_build.partitions = partitions-secure.csv

; Deliberately no upload_port: flashing this to real hardware should be a
; considered act, not a tab-completion away.
upload_protocol = custom

; ============================================================================
; QEMU variants — emulation only
;
; Identical to their parents except the console is routed to UART0, because
; QEMU's esp32s3 machine has no USB-Serial-JTAG device model and the firmware's
; output otherwise vanishes into a peripheral that does not exist. See
; sdkconfig.qemu-console for the full story; the short version is that this is
; what turned "the secure target hangs" into "the secure target boots".
;
; The defaults list is semicolon-separated and set on BOTH `sdkconfig_defaults`
; and `cmake_extra_args`. Setting one without the other silently loses the
; override — that is the fault that produced a "successful" secure build with
; no security options in it. Verify with scripts/preflight.sh, never by eye.
; ============================================================================
[env:esp32s3-qemu]
extends = env:esp32s3
board_build.sdkconfig_defaults = sdkconfig.defaults;sdkconfig.qemu-console
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.qemu-console"
upload_protocol = custom

[env:esp32s3-secure-qemu]
extends = env:esp32s3-secure
board_build.sdkconfig_defaults = sdkconfig.secure;sdkconfig.qemu-console
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.secure;sdkconfig.qemu-console"
board_build.partitions = partitions-secure.csv
upload_protocol = custom

; ============================================================================
; Firefly Pixie — ESP32-C3, EXPERIMENTAL
;
; A second target, not a fork: see docs/PIXIE-PORT.md. The wallet, the
; protocol, the session layer and the crypto, on a RISC-V C3, with the same
; ST7789 driver and colour UI as esp32s3cam-color (the Pixie profile in
; src/oled-st7789.c). No Zcash signer: zsign is built for Xtensa only.
;
; Do not flash this to a Pixie expecting a Zcash wallet.
; ============================================================================
[env:pixie]
extends = env:esp32s3
board = esp32-c3-devkitm-1
; The Rust signer is built for Xtensa only; the C3 is RISC-V. No signer here
; until a riscv32imc build of zsign-rust exists.
extra_scripts =
build_flags =
    -DLEEK_BOARD_PIXIE
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0
; The Pixie also has 16 MB, so the partition table carries over unchanged.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB

; ============================================================================
; ESP32-S3-N16R8 CAM + OV5640
;
; Same SoC as the reference board and a completely different pin map: the
; camera owns GPIO 4-18 except 14, which is where the reference board keeps
; its I2C panel and all four buttons. src/board.h holds the map and
; docs/BOARD-S3CAM-PINOUT.md holds the evidence for it.
;
; This environment builds; it does not yet do anything the reference board
; does not. Camera, microSD and the SD vault arrive in later phases behind
; LEEK_HAS_CAMERA, LEEK_HAS_SDCARD and LEEK_VAULT_ON_SD.
; ============================================================================
[env:esp32s3cam]
extends = env:esp32s3
build_flags =
    -DLEEK_BOARD_S3CAM
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0

; PSRAM, for this board only. The overlay is applied ON TOP of
; sdkconfig.defaults - a list, not a replacement - so the reference board and
; the Pixie see exactly the configuration they saw before it existed.
;
; Both keys, always. `extends` inherits the base environment's
; cmake_extra_args, which pins SDKCONFIG_DEFAULTS and wins over
; sdkconfig_defaults; setting only the latter here would silently build without
; PSRAM while looking configured, which is the failure sdkconfig.secure already
; records above.
board_build.sdkconfig_defaults = sdkconfig.defaults;sdkconfig.s3cam
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3cam"
    -DLEEK_CAMERA_DRIVER=1

; ============================================================================
; ESP32-S3 CAM, colour kit: 240x240 ST7789 + knob + Cancel
;
; The same board as esp32s3cam with a different screen: a square 240x240 SPI
; TFT module with the rotary encoder and one button built in. A named
; combination, not a fork: the board's pin map and every other component are
; the CAM board's, and board.h refuses a pairing the board has no pins for.
; Wiring: docs/WIRING-S3CAM-COLOR.md.
;
; The panel's SPI takes K1's and K2's pins (GPIO1, GPIO41), so this kit is
; knob-only. The I2C bus (47/21) is left free for the secure element. If the
; picture is mirrored, shifted or in negative, the ST7789_* flags below are
; the fix (see the wiring doc); nothing in src/ needs to change.
; ============================================================================
[env:esp32s3cam-color]
extends = env:esp32s3cam
build_flags =
    -DLEEK_BOARD_S3CAM
    -DLEEK_DISPLAY=LEEK_DISPLAY_ST7789
    -DLEEK_INPUT=LEEK_INPUT_KNOB
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0
;   -DST7789_ROTATION=0      ; 0-3, a quarter turn each (RAM offset follows)
;   -DST7789_INVERT=1        ; 0 if black shows white
;   -DST7789_BGR=0           ; 1 if red and blue are swapped
;   -DST7789_SPI_HZ=40000000 ; lower if long wires show speckles
; Both keys, as for esp32s3cam: the overlay keeps the SPI driver's ISR out of
; IRAM, which the UI task's stack needs as heap (sdkconfig.color).
board_build.sdkconfig_defaults = sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color"
    -DLEEK_CAMERA_DRIVER=1

; ============================================================================
; ESP32-S3 CAM, colour kit: QR speed A/B images (research/quirc-speed).
;
; Both are esp32s3cam-color plus quirc options passed as CMake variables
; (components/quirc/CMakeLists.txt). Both print a second line a second while
; scanning, `camera: quirc thr .. find .. grid .. jig .. | fail fmt .. ecc ..`:
; where `ident` goes, and why located codes do not decode.
;
;   -qstages  upstream quirc maths, timed: the A side.
;   -qfast    the same with perspective_map() inline (no __divsf3 or rintf
;             calls), bit-identical by construction; it logs a self-test of
;             that once per boot ("self-test 0 of 80000 differ").
;
;   pio run -e esp32s3cam-color-qstages -t upload
;   pio run -e esp32s3cam-color-qfast -t upload
;
; Same wallet, same partitions; flash esp32s3cam-color again afterwards.
; ============================================================================
[env:esp32s3cam-color-qstages]
extends = env:esp32s3cam-color
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color"
    -DLEEK_CAMERA_DRIVER=1
    -DQUIRC_STAGE_TIMING=1

[env:esp32s3cam-color-qfast]
extends = env:esp32s3cam-color
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color"
    -DLEEK_CAMERA_DRIVER=1
    -DQUIRC_STAGE_TIMING=1
    -DQUIRC_FAST_PERSPECTIVE=1

; -qfast with a shorter sensor frame at 2x and 3x zoom (camera-tune.h,
; CAMERA_ZOOM_VTS; untested on the board until now): the OV5640 gives 7.7
; frames/s at QVGA however fast quirc gets, and VTS 700 for 984 lifts that to
; about 10.8. Only once -qfast has made quirc faster than the sensor. Back off
; to esp32s3cam-color-qfast on any capture timeout.
[env:esp32s3cam-color-qfast-vts]
extends = env:esp32s3cam-color-qfast
build_flags =
    ${env:esp32s3cam-color.build_flags}
    -DCAMERA_ZOOM_VTS=700

; ============================================================================
; ESP32-S3 CAM, colour kit + OPTIGA Trust M: the SE backup DEVELOPMENT image.
;
; esp32s3cam-color with the secure element fitted on I2C0 (GPIO47/21, its own
; bus on this kit; src/se-optiga.c installs the driver) and the Level 1
; container's one write compiled in (LEEK_SE_CONTAINER_WRITES, a CMake
; variable: see components/leek-se-optiga/README.md). It adds Settings >
; Secure element: copy the open seed to the chip, compare, restore, erase,
; and SD file -> SE / vault (docs/BACKUP.md). Never a release image: Level 1
; leaves the chip unlocked, so the copy there is a backup location, not
; security. Without this env nothing of it is built.
;
;   pio run -e esp32s3cam-color-se -t upload
; ============================================================================
[env:esp32s3cam-color-se]
extends = env:esp32s3cam-color
build_flags =
    ${env:esp32s3cam-color.build_flags}
    -DLEEK_SE=LEEK_SE_OPTIGA
; All three keys again: `extends` would carry the colour env's args, which
; lack the flag. Same sdkconfig overlays as esp32s3cam-color.
board_build.sdkconfig_defaults = sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color
board_build.cmake_extra_args =
    -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.s3cam;sdkconfig.color"
    -DLEEK_CAMERA_DRIVER=1
    -DLEEK_SE_CONTAINER_WRITES=1

; ============================================================================
; The decode-rate instrument.
;
; Identical to esp32s3cam except that app_main() hands the board to the QR
; bench and returns: no wallet, no UI, no BLE. It exists because the frame rate
; of this pipeline is the one number research/qr-spike could not produce - QEMU
; emulates no image sensor, and its wall-clock times are emulator artefacts.
;
;   pio run -e esp32s3cam-bench -t upload && pio device monitor -e esp32s3cam-bench
;
; Point the sensor at a phone animating any multi-part UR and read the
; frames/s and decodes/s lines. Flash the ordinary esp32s3cam image afterwards;
; this one holds no seeds and cannot.
; ============================================================================
[env:esp32s3cam-bench]
extends = env:esp32s3cam
build_flags =
    ${env:esp32s3cam.build_flags}
    -DLEEK_QR_BENCH=1

; ============================================================================
; The secure-element bench: OPTIGA Trust M bring-up, read-only.
;
; Same idea as esp32s3cam-bench: app_main() hands the board to se-bench.c and
; returns, so there is no wallet, no UI and no seed on this image. It scans
; I2C0, identifies a Trust M at 0x30, prints its UID, lifecycle state,
; security event counter, the SHA-256 of its factory certificate and the
; access rules of a few objects, runs a TRNG smoke test, and repeats every
; 20 s. Nothing is written to the chip: the component has no write command
; to send. See components/leek-se-optiga/README.md for wiring and output.
;
;   pio run -e esp32s3cam-se-bench -t upload && pio device monitor -e esp32s3cam-se-bench
;
; Flash the ordinary esp32s3cam image afterwards.
; ============================================================================
[env:esp32s3cam-se-bench]
extends = env:esp32s3cam
build_flags =
    ${env:esp32s3cam.build_flags}
    -DLEEK_SE_BENCH=1


; ============================================================================
; The colour panel bench: ST7789 module bring-up, wiring only.
;
; Same idea as the other benches: app_main() hands the board to
; panel-bench.c and returns, so there is no wallet, no UI and no vault access.
; It bit-bangs SCL/SDA/DC (no SPI peripheral), cycles SPI modes 3, 0, 2, 1 and
; fills the screen red, green, blue in each, logging every step. It also
; drives GPIO48 as an active-low CS, so the module's CS wire can be moved
; from GND to header pin 48 without a reflash.
;
;   pio run -e esp32s3cam-panel-bench -t upload && pio device monitor -e esp32s3cam-panel-bench
;
; Flash the ordinary esp32s3cam-color image afterwards.
; ============================================================================
[env:esp32s3cam-panel-bench]
extends = env:esp32s3cam-color
build_flags =
    ${env:esp32s3cam-color.build_flags}
    -DLEEK_PANEL_BENCH=1

; QEMU variant of the CAM board.
;
; Worth being clear about what this can and cannot show: QEMU emulates the S3's
; CPU, memory and eFuses, and emulates no image sensor at all. It exercises
; everything on this board except the camera, and it cannot produce a frame
; rate. See research/qr-spike/README.md.
[env:esp32s3cam-qemu]
extends = env:esp32s3-qemu
build_flags =
    -DLEEK_BOARD_S3CAM
    -DUSE_BIP32_CACHE=0
    -DUSE_BIP39_CACHE=0

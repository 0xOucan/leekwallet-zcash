[package]
name = "zsign-rust"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "LeekWallet Zcash: Rust signer backend (no_std, C ABI)"

[lib]
crate-type = ["staticlib"]

[dependencies]
orchard = { version = "0.16", default-features = false, features = ["zeroize"] }
pasta_curves = { version = "0.6", default-features = false, features = ["alloc"] }
zip32 = { version = "0.3", default-features = false }
zcash_address = { version = "=0.14.0-pre.2", default-features = false }
zcash_protocol = { version = "=0.11.0-pre.1", default-features = false }
rand_core = { version = "0.10", default-features = false }
ff = { version = "0.14", default-features = false }
group = { version = "0.14", default-features = false }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

[profile.dev]
panic = "abort"
opt-level = 1

# radium 0.7 (via bitvec) assumes 64-bit atomics on unknown targets; Xtensa has
# none. Same fix the Ledger Zcash app vendors.
[patch.crates-io]
radium = { path = "vendor/radium" }

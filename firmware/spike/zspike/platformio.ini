[platformio]
src_dir = main

; Phase 0.4 spike: Rust Orchard primitives on the ESP32-S3, timed.
[env:esp32s3]
platform = espressif32@6.12.0
framework = espidf
board = esp32-s3-devkitc-1
board_build.flash_size = 4MB
board_build.sdkconfig_defaults = sdkconfig.defaults
build_flags = -DZSPIKE=1
custom_zsign_dir = ../../components/zsign-rust
extra_scripts = pre:../../scripts/zsign_cargo.py

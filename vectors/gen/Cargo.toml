[package]
name = "vectors-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "LeekWallet Zcash: generate reference test vectors from librustzcash"

# The released librustzcash crates, pinned. The generated vectors are
# committed, so this only matters when regenerating them.
[dependencies]
zcash_address = { version = "=0.14.0" }
zcash_keys = { version = "=0.17.0", features = ["orchard", "transparent-inputs", "test-dependencies"] }
zcash_protocol = { version = "=0.11.0" }
zcash_transparent = { version = "=0.11.0", features = ["transparent-inputs"] }
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
zip32 = "0.3"
bip39 = { version = "2", features = ["std"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pczt = { version = "=0.10.0", features = ["zcp-builder", "io-finalizer", "signer", "orchard", "transparent"] }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "transparent-inputs"] }
zcash_note_encryption = "0.5.1"
shardtree = "0.8"
incrementalmerkletree = "0.9"
rand = { version = "0.10", features = ["sys_rng"] }
rand_chacha = "0.10"
postcard = { version = "1", features = ["alloc"] }
# Already in the tree through zcash_transparent; the transparent vectors
# need its key types.
secp256k1 = "0.33"
# Already in the tree through orchard; the duplicate-rk vector reads alpha.
ff = "0.14"

[[bin]]
name = "vectors-gen"
path = "src/main.rs"

[[bin]]
name = "pczt-vectors"
path = "src/bin/pczt_vectors.rs"

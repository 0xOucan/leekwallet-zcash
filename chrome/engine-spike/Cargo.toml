[package]
name = "engine-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Phase 9.1 spike: can the Zcash wallet engine (sync, PCZT, Orchard/Ironwood proving) run in a Chrome extension as WASM?"

# Standalone: not a member of host/ (that workspace pins native-only pieces).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Halo 2 multicore (rayon). On wasm32 it needs the `threads` build
# (atomics + build-std) and wasm-bindgen-rayon; see README.
multicore = ["orchard/multicore"]
threads = ["multicore", "dep:wasm-bindgen-rayon"]
# The rest of the wallet engine: zecz-core's librustzcash pieces, with
# gRPC-web instead of tonic's native HTTP/2 transport.
engine = [
    "dep:zcash_client_backend",
    "dep:zcash_keys",
    "dep:zcash_protocol",
    "dep:pczt",
    "dep:zip32",
    "dep:bip39",
    "dep:tonic",
    "dep:prost",
    "dep:tonic-web-wasm-client",
    "dep:wasm-bindgen-futures",
]
# zecz-core's storage and wallet flow (sync::run, propose, create PCZT).
# rusqlite 0.37 alone does not build for wasm32-unknown-unknown (bundled
# SQLite needs libc headers); [patch.crates-io] below swaps libsqlite3-sys
# for a stand-in backed by sqlite-wasm-rs.
sqlite = [
    "engine",
    "dep:zcash_client_sqlite",
    "dep:zcash_primitives",
    "dep:zip321",
    "dep:rusqlite",
    "dep:async-trait",
    "dep:uuid",
    "dep:tracing",
]

[dependencies]
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }

# Same rev as host/zecz-core.
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true, default-features = false, features = ["orchard", "transparent-inputs", "pczt", "sync"] }
zcash_client_sqlite = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true, default-features = false, features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true, features = ["orchard", "transparent-inputs"] }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true }
pczt = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true, features = ["orchard", "transparent", "signer", "prover", "tx-extractor"] }
# Not its default `multicore`: that needs the threads build on wasm32.
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true, default-features = false, features = ["std", "circuits"] }
zip321 = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", optional = true }
rusqlite = { version = "0.37", optional = true }
async-trait = { version = "0.1", optional = true }
# librustzcash logs through tracing; wallet.rs forwards it to console.log.
tracing = { version = "0.1", optional = true, default-features = false, features = ["std"] }
zip32 = { version = "0.3", optional = true }
bip39 = { version = "2", optional = true, default-features = false, features = ["std"] }
# =0.14.2: tonic 0.14.6 rejects a stream that ends without a grpc-status
# trailer frame, and tonic-web-wasm-client 0.8 never emits one (it parses
# the gRPC-web trailer but does not hand it to tonic): every call fails with
# "missing grpc-status trailer". 0.14.2 is also what host/ uses.
tonic = { version = "=0.14.2", optional = true, default-features = false, features = ["codegen"] }
prost = { version = "0.14", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
# no-bundler: the stock helper does import("../../.."), which only a bundler resolves.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = "0.3"
# gRPC-web over fetch(): needs a gRPC-web endpoint (a proxy in front of
# lightwalletd; testnet.zec.rocks speaks plain gRPC only).
tonic-web-wasm-client = { version = "0.8", optional = true }
# zcash_client_sqlite makes account UUIDs; uuid needs a randomness source on wasm32.
uuid = { version = "1", optional = true, features = ["js"] }

[patch.crates-io]
libsqlite3-sys = { path = "../engine/patches/libsqlite3-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "leek-chrome-engine"
version = "0.1.0"
edition = "2021"
publish = false
description = "LeekWallet Zcash wallet engine for the Chrome extension: zecz-core's flow (zcash_client_sqlite on OPFS, sync over gRPC-web, PCZT, .zsig, prove, extract, broadcast) compiled to WASM with threads, driven by JSON messages from a dedicated worker"

# Standalone: wasm32 only, with its own [patch.crates-io] (host/ is native).
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Rayon on wasm32 (atomics + build-std + wasm-bindgen-rayon); build.sh always
# turns it on. Without it sync::run never finishes (CHROME-ENGINE.md 3.1).
threads = ["orchard/multicore", "dep:wasm-bindgen-rayon"]

[dependencies]
# Same releases as host/zecz-core. `default-features = false` drops their
# `multicore`, which needs the threads build on wasm32.
zcash_client_backend = { version = "=0.25.0", default-features = false, features = ["orchard", "transparent-inputs", "pczt", "sync"] }
zcash_client_sqlite = { version = "=0.23.0", default-features = false, features = ["orchard", "transparent-inputs", "serde"] }
zcash_keys = { version = "=0.17.0", features = ["orchard", "transparent-inputs"] }
zcash_protocol = { version = "=0.11.0" }
zcash_address = { version = "=0.14.0" }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std", "circuits", "transparent-inputs"] }
zcash_transparent = { version = "=0.11.0", features = ["transparent-inputs"] }
zip321 = { version = "=0.10.0" }
pczt = { version = "=0.10.0", features = ["orchard", "transparent", "signer", "prover", "tx-extractor"] }
orchard = { version = "0.16", default-features = false, features = ["std", "circuit"] }
zip32 = "0.3"
secp256k1 = "0.33"
rusqlite = "0.37"
rand = { version = "0.10", default-features = false, features = ["sys_rng"] }
async-trait = "0.1"
anyhow = "1"
bip39 = { version = "2", default-features = false, features = ["std"] }
hex = "0.4"
sha2 = "0.10"
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# librustzcash logs through tracing; forwarded to the console (INFO and up).
tracing = { version = "0.1", default-features = false, features = ["std"] }
# =0.14.2: tonic 0.14.6 rejects a stream without a grpc-status trailer
# frame, which tonic-web-wasm-client 0.8 never emits (CHROME-ENGINE.md 3).
tonic = { version = "=0.14.2", default-features = false, features = ["codegen"] }
prost = "0.14"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
getrandom = { version = "0.4", features = ["wasm_js"] }
# no-bundler: the stock helper imports "../../..", which only a bundler resolves.
wasm-bindgen-rayon = { version = "1.3", optional = true, features = ["no-bundler"] }
# gRPC-web over fetch(); needs a gRPC-web endpoint (CHROME-ENGINE.md 4).
tonic-web-wasm-client = "0.8"
# zcash_client_sqlite makes account UUIDs.
uuid = { version = "1", features = ["js"] }
# SQLite itself (through the libsqlite3-sys stand-in) and its OPFS VFS:
# sync access handles in a pool of OPFS files, dedicated workers only.
sqlite-wasm-rs = { version = "0.6", features = ["wasm-bindgen"] }
sqlite-wasm-vfs = { version = "0.3", features = ["sahpool"] }

[patch.crates-io]
libsqlite3-sys = { path = "patches/libsqlite3-sys" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[package]
name = "leekwallet-zcash-desktop"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "LeekWallet Zcash desktop app (Tauri v2) over the zecz wallet library"

# Its own workspace, not a member of host/: the Tauri tree (webkit2gtk,
# tao, wry) has no business in the lock file the CLI and the Android
# library build from, and `tauri build` / tauri-action expect src-tauri to
# be a self-contained Cargo project. host/Cargo.lock cannot seed this one:
# it carries an old Tauri (leek-transport-serial's optional Android
# feature) that no longer builds against current tauri-runtime. The
# librustzcash stack is the same either way: its git rev is pinned in
# zecz-core, and orchard, halo2 and pczt resolve to the same versions.
[workspace]

# A plain rlib: desktop only (Android is the Zodl fork, Phase 6), so no
# cdylib/staticlib for a mobile shell.
[lib]
name = "leekwallet_zcash_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
zecz-core = { path = "../../host/zecz-core" }
# The device links: LeekWallet's serial transport (port listing; zecz's
# Device opens the port through it) and its btleplug Bluetooth transport,
# which src/link.rs adapts to leek-device's FramePort.
leek-transport-serial = { path = "../../firmware/app/transport-serial" }
leek-transport-ble = { path = "../../firmware/app/transport-ble" }
# The receive QR code, drawn as SVG here so the webview ships no QR code
# of its own; no image feature (no raster images, no image crate).
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
# NEAR Intents' 1Click API (src/near.rs): blocking HTTPS on the worker
# threads, over rustls with ring and the webpki roots, the TLS stack the
# lightwalletd client already links. No gzip, no cookies.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# RFC 3339 deadlines of 1Click quotes.
time = { version = "0.3", features = ["formatting", "parsing"] }

[dev-dependencies]
serde_json = "1"
hex = "0.4"
# The device tests build a wallet birthday offline and prove what the
# device signed, as host/zecz-core's tests do (the same pinned revision).
pczt = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b", features = ["orchard", "transparent", "signer", "prover", "tx-extractor"] }
zcash_client_backend = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b" }
zcash_protocol = { git = "https://github.com/zcash/librustzcash", rev = "16f0723c385957cecc32b4f0c71bb411053b708b" }
rand = { version = "0.10", features = ["sys_rng"] }

# Scanning (trial decryption) and Halo 2 proving are unbearably slow
# unoptimized, so dependencies are always optimized; the app crate itself
# stays quick to rebuild.
[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
strip = true
